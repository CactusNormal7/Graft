[package]
name = "graft-mcp"
version = "0.1.0"
description = "MCP server (stdio) giving Claude access to Graft projects, without the app running"
edition = "2021"

[dependencies]
graft-core = { path = "../graft-core" }
# Official Rust MCP SDK: stdio transport + #[tool] / #[prompt] macros.
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
